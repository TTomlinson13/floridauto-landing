<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | FloridAuto.com</title>
    <style>
      :root {
        --navy: #1e3a8a;
        --navy-light: #1d4ed8;
        --gold: #facc15;
        --ink: #0f172a;
        --muted: #475569;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        color: var(--ink);
        background: linear-gradient(160deg, #eff6ff 0%, #ffffff 55%, #f8fafc 100%);
      }
      .wrap { max-width: 34rem; text-align: center; }
      .brand {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--navy);
        letter-spacing: -0.02em;
        margin: 0 0 2rem;
      }
      .code {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--navy-light);
        margin: 0 0 0.75rem;
      }
      h1 { font-size: 1.85rem; line-height: 1.25; margin: 0 0 0.85rem; }
      p { color: var(--muted); line-height: 1.65; margin: 0 0 1.75rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a.btn {
        display: inline-block;
        padding: 0.8rem 1.6rem;
        border-radius: 0.5rem;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      a.primary { background: var(--gold); color: #000; }
      a.primary:hover { background: #eab308; }
      a.secondary { background: var(--navy); color: #fff; }
      a.secondary:hover { background: var(--navy-light); }
      .links { margin-top: 2.25rem; font-size: 0.925rem; }
      .links a { color: var(--navy); text-decoration: none; }
      .links a:hover { text-decoration: underline; }
      .sep { color: #cbd5e1; margin: 0 0.5rem; }
      @media (max-width: 30rem) {
        h1 { font-size: 1.5rem; }
        .actions { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="brand">FloridAuto.com</p>
      <p class="code">Error 404</p>
      <h1>We couldn&rsquo;t find that page</h1>
      <p>
        The page you&rsquo;re looking for may have moved or no longer exists. We can still get
        you covered &mdash; same-day Florida auto insurance, including drivers other agents
        turn away.
      </p>
      <div class="actions">
        <a class="btn primary" href="tel:800-616-1418">Call 800-616-1418</a>
        <a class="btn secondary" href="/">Get a Quote</a>
      </div>
      <p class="links">
        <a href="/">Home</a><span class="sep">&middot;</span>
        <a href="/blog">Florida Auto Insurance News</a>
      </p>
    </div>
  </body>
</html>
